name: docker

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  schedule:
    - cron: "0 4 1 * *"   # monthly rebuild (1st, 04:00 UTC) to pick up base image updates
  workflow_dispatch:

env:
  IMAGE: ghcr.io/itefix/ulaknode-exporter

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the Dockerfile
      - name: unit tests
        run: python -m unittest -v test_exporter
      - name: check dashboard JSON
        run: python -m json.tool grafana-dashboard.json > /dev/null

  # Pull requests and pushes to main only verify that the image builds. Release
  # tags publish it, and scheduled or manual runs rebuild the latest release.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to find the latest release
      - name: select release
        id: v
        run: |
          if [[ "$PUBLISH" == true ]]; then
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              tag="$GITHUB_REF_NAME"
            else
              tag="$latest"
              [[ -n "$tag" ]] || { echo "::error::no release tag to rebuild"; exit 1; }
              git checkout --quiet "$tag"
            fi
            version="${tag#v}"
            tags="$IMAGE:$version"
            # Rebuilding an older release must not move the floating tags.
            if [[ "$tag" == "$latest" ]]; then
              tags="$tags,$IMAGE:${version%.*},$IMAGE:latest"
            fi
          else
            version=dev
            tags="$IMAGE:dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .   # the checked-out files, not the triggering commit
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ env.PUBLISH == 'true' }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=BSD-2-Clause
